# Pila completa de SIRAI con un solo comando: docker compose up -d
#
# - Las imágenes se descargan de GHCR por defecto (IMAGE_REGISTRY/IMAGE_TAG);
#   con `docker compose up --build` se construyen localmente.
# - La semilla de desarrollo solo corre con SEED_DEV_DATA=true (nunca en
#   entornos compartidos). Las variables viven en .env (copia .env.example).
# - Para desarrollo con pnpm basta `docker compose up -d mysql`.
# - MYSQL_PORT permite cambiar el puerto publicado si 3306 ya está ocupado
#   (revisa con: lsof -nP -iTCP:3306 -sTCP:LISTEN).

name: sirai

x-api-image: &api-image ${IMAGE_REGISTRY:-ghcr.io/team-isstech}/ebdi-asistencia-api:${IMAGE_TAG:-main}
x-web-image: &web-image ${IMAGE_REGISTRY:-ghcr.io/team-isstech}/ebdi-asistencia-web:${IMAGE_TAG:-main}
x-database-url: &database-url mysql://sirai:sirai@mysql:3306/sirai

services:
  mysql:
    image: mysql:8.4
    container_name: sirai-mysql
    # Las migraciones crean triggers (auditoría inmutable); con binlog activo
    # MySQL exige SUPER o este flag para usuarios sin ese privilegio.
    command: ["mysqld", "--log-bin-trust-function-creators=1"]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sirai
      MYSQL_USER: sirai
      MYSQL_PASSWORD: sirai
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - sirai-mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # Por TCP (127.0.0.1), no por socket: durante la inicialización del
      # primer arranque el servidor temporal acepta el socket pero no la red.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-usirai", "-psirai"]
      interval: 5s
      timeout: 3s
      start_period: 20s
      retries: 30

  # Un solo disparo: aplica packages/db/sql/*.sql y, si se pide, la semilla.
  migrate:
    image: *api-image
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    pull_policy: missing
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    init: true
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: *database-url
      # La semilla además se niega a correr con NODE_ENV=production.
      SEED_DEV_DATA: ${SEED_DEV_DATA:-false}
      SEED_PASSWORD: ${SEED_PASSWORD:-}
    command:
      - sh
      - -c
      - |
        set -e
        node node_modules/@sirai/db/dist/cli/migrate.js
        if [ "$$SEED_DEV_DATA" = "true" ]; then node node_modules/@sirai/db/dist/cli/seed.js; fi

  api:
    image: *api-image
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    pull_policy: missing
    container_name: sirai-api
    init: true
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      # Pila local por http: development permite COOKIE_SECURE=false. Con
      # NODE_ENV=production la API se niega a arrancar sin COOKIE_SECURE=true
      # (y entonces hace falta HTTPS delante).
      NODE_ENV: ${NODE_ENV:-development}
      PORT: "3000"
      DATABASE_URL: *database-url
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      SESSION_MAX_HOURS: ${SESSION_MAX_HOURS:-72}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_LOCK_MINUTES: ${LOGIN_LOCK_MINUTES:-15}
      LOGIN_RATE_LIMIT_PER_MINUTE: ${LOGIN_RATE_LIMIT_PER_MINUTE:-10}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PRIVACY_NOTICE_VERSION: ${PRIVACY_NOTICE_VERSION:-}
      TEMP_PASSWORD_DAYS: ${TEMP_PASSWORD_DAYS:-7}
      API_TOKEN_SECRET: ${API_TOKEN_SECRET:-}
      INTEGRATION_TOKEN_MINUTES: ${INTEGRATION_TOKEN_MINUTES:-15}
      INTEGRATION_RATE_LIMIT_PER_MINUTE: ${INTEGRATION_RATE_LIMIT_PER_MINUTE:-60}
      EMERGENCY_NOTICE_JOB_SECONDS: ${EMERGENCY_NOTICE_JOB_SECONDS:-60}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_TEMPLATE_NAME: ${WHATSAPP_TEMPLATE_NAME:-}
      WHATSAPP_TEMPLATE_LANGUAGE: ${WHATSAPP_TEMPLATE_LANGUAGE:-}
      # nginx reenvía con X-Forwarded-For; sin esto todas las IP serían la del proxy.
      TRUST_PROXY: "true"
      WEB_ORIGIN: http://localhost:${WEB_PORT:-8080}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?Define DATA_ENCRYPTION_KEY en .env (openssl rand -hex 32)}
    # Sin puerto publicado: la única entrada es nginx (web), que fija
    # X-Forwarded-For. Para depurar la API directamente usa un
    # docker-compose.override.yml con `ports: ["127.0.0.1:3000:3000"]`.

  web:
    image: *web-image
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    pull_policy: missing
    container_name: sirai-web
    init: true
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"

volumes:
  sirai-mysql-data:
