# Mantiene las acciones de GitHub al día (las versiones @vN son etiquetas móviles).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [ci]
  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: weekly
    labels: [ci]
  - package-ecosystem: docker
    directory: /apps/web
    schedule:
      interval: weekly
    labels: [ci]
