# Sirve la SPA y reenvía /api al servicio api del mismo compose.
server_tokens off;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 2m;

    # Cabeceras de seguridad básicas; la CSP estricta llega con el despliegue real.
    # nginx no hereda add_header en bloques que definen el suyo: se repiten abajo.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        # Detrás de un balanceador o CDN hay que añadir aquí `set_real_ip_from`
        # con la red del balanceador y `real_ip_header X-Forwarded-For`; si no,
        # la API verá la IP del balanceador en el límite de login y la auditoría.
        # Resolver interno de Docker con TTL corto: si el contenedor api se
        # recrea con otra IP, nginx lo vuelve a resolver en vez de devolver 502.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:3000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }

    # La SPA no debe quedar cacheada: cada despliegue cambia los nombres de assets.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
